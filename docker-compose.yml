# Postgres local para correr el backend con el perfil `prod`.
# Credenciales solo para desarrollo local; se pueden pisar con variables de entorno o un .env.
#
#   docker compose up -d
#   cd backend
#   SPRING_PROFILES_ACTIVE=prod \
#   DATABASE_URL=jdbc:postgresql://localhost:5432/smartelevate \
#   DATABASE_USER=smartelevate DATABASE_PASSWORD=smartelevate \
#   JPA_DDL_AUTO=update ./mvnw spring-boot:run
services:
  postgres:
    image: postgres:18-alpine
    container_name: smartelevate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartelevate}
      POSTGRES_USER: ${POSTGRES_USER:-smartelevate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartelevate}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ guarda los datos en /var/lib/postgresql/<versión>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
