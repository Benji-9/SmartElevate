# Se suma al application.yml de main (classpath:/config/ tiene prioridad sobre classpath:/).
# Sin jobs @Scheduled en los tests: se invocan a mano con un Clock.fixed.
app.scheduling.enabled=false

# Todas las pruebas piden desde la IP de MockMvc: sin esto, el tope por IP (#344) frenaría las que registran
# muchas cuentas. RequestThrottleApiTest lo vuelve al valor real.
app.request-throttle.max-per-ip=100000

# Los mails async corren en el hilo que llama (SyncMailExecutorConfig): tests deterministas.
test.mail.sync-executor=true
