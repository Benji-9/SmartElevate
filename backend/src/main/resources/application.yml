spring:
  application:
    name: smartelevate-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean las migraciones de Flyway (ADR 0004); Hibernate solo valida que las
      # entidades coincidan con él. Vale para todos los perfiles.
      ddl-auto: validate
  flyway:
    # Flyway nunca borra la base desde la app, ni por error en producción.
    clean-disabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  cors:
    # Lista separada por comas, p. ej. "http://localhost:5173,https://smartelevate.vercel.app"
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: SmartElevate API
    version: "@project.version@"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # Salida determinística para que docs/openapi.json tenga diffs limpios.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
