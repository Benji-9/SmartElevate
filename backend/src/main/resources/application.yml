spring:
  application:
    name: smartelevate-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean las migraciones de Flyway (ADR 0004); Hibernate solo valida que las
      # entidades coincidan con él. Vale para todos los perfiles.
      ddl-auto: validate
  flyway:
    # Flyway nunca borra la base desde la app, ni por error en producción.
    clean-disabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  time:
    # Zona del campus para franjas y horario de operación; los instantes se guardan en UTC (ADR 0010).
    zone: ${APP_TIME_ZONE:America/Argentina/Buenos_Aires}
  security:
    jwt:
      # Secreto de firma HS256 (mínimo 32 caracteres). Obligatorio en prod; en dev, si falta, se genera uno efímero.
      secret: ${JWT_SECRET:}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  mail:
    # false (default): el mail solo se loguea. En prod se activa con APP_MAIL_ENABLED=true (SMTP, ADR 0013).
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@localhost}
  # Parámetros técnicos y de seguridad: acá, con override por variable de entorno. En app_config van solo las
  # reglas de negocio ajustables sin redeploy; los secretos, solo en variables de entorno (#225).
  login-throttle:
    # Límite de logins fallidos (ADR 0015): ventana deslizante y topes. Por cuenta, entre 1 y 100 (NIST).
    window: ${APP_LOGIN_THROTTLE_WINDOW:PT15M}
    max-failures-per-account: ${APP_LOGIN_THROTTLE_MAX_FAILURES_PER_ACCOUNT:10}
    max-failures-per-ip: ${APP_LOGIN_THROTTLE_MAX_FAILURES_PER_IP:100}
  admin:
    user-search:
      # Buscador de usuarios del panel admin (#215): mínimo de caracteres para no listar a todos, y tamaño de página.
      min-query-length: ${APP_ADMIN_USER_SEARCH_MIN_QUERY_LENGTH:3}
      page-size: ${APP_ADMIN_USER_SEARCH_PAGE_SIZE:20}
  verification:
    token-ttl: ${APP_VERIFICATION_TOKEN_TTL:PT24H}
    resend-cooldown: ${APP_VERIFICATION_RESEND_COOLDOWN:PT1M}
    # Base del link del mail de verificación. Obligatoria en prod (RequiredProdProperties); el default localhost
    # vive solo en application-dev.yml.
    frontend-url: ${APP_FRONTEND_URL:}
  password-reset:
    token-ttl: ${APP_PASSWORD_RESET_TOKEN_TTL:PT30M}
    request-cooldown: ${APP_PASSWORD_RESET_REQUEST_COOLDOWN:PT1M}
  kiosk:
    # Clave HMAC-SHA256 del token del QR (ADR 0016, 0020): secreto, solo por variable de entorno y distinto de
    # JWT_SECRET; mínimo 32 bytes. Sin valor en el repo: en prod la app no arranca sin ella; en dev se usa una efímera.
    qr-secret: ${APP_KIOSK_QR_SECRET:}
    # Vida de cada token del QR (segundos enteros); se acepta además el del ciclo anterior. Reemplaza a qr_rotation.
    qr-ttl: ${APP_KIOSK_QR_TTL:PT30S}
    # false (default): no se pueden crear kioscos simulados (simulador de admin, #232).
    simulator-enabled: ${APP_KIOSK_SIMULATOR_ENABLED:false}
    # Tope de pedidos de token por kiosco (se espera ~1 cada 30 s): 10 por minuto deja margen para recargas.
    rate-limit-max-requests: ${APP_KIOSK_RATE_LIMIT_MAX_REQUESTS:10}
    rate-limit-window: ${APP_KIOSK_RATE_LIMIT_WINDOW:PT1M}
  scheduling:
    # Jobs @Scheduled (no-shows). Los tests lo apagan (src/test/resources/config/application.properties).
    enabled: ${APP_SCHEDULING_ENABLED:true}
  no-show-job:
    # Cada cuánto se marcan los no-shows (#231). Técnico: el umbral de negocio es no_show_after en app_config.
    interval: ${APP_NO_SHOW_JOB_INTERVAL:PT15S}
  cors:
    # Lista separada por comas, p. ej. "http://localhost:5173,https://smartelevate.vercel.app". Obligatoria en
    # prod; el default localhost vive solo en application-dev.yml.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: SmartElevate API
    version: "@project.version@"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # Salida determinística para que docs/openapi.json tenga diffs limpios.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
