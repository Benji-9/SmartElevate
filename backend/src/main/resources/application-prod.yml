# Perfil de producción: Postgres configurado 100% por variables de entorno.
# DATABASE_URL va en formato JDBC, p. ej. jdbc:postgresql://host:5432/smartelevate
# El esquema lo crea Flyway al arrancar (ADR 0004); Hibernate solo lo valida.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  # Host, puerto, usuario y clave SMTP llegan por SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD (ADR 0013).
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # Sin timeouts, un SMTP colgado bloquea el hilo para siempre (ADR 0017: técnico, override por variable).
      mail.smtp.connectiontimeout: ${APP_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${APP_MAIL_SMTP_TIMEOUT:10000}
      mail.smtp.writetimeout: ${APP_MAIL_SMTP_WRITE_TIMEOUT:10000}
  task:
    scheduling:
      # Dos hilos: un mail lento del job de recordatorios no frena el de no-shows.
      pool:
        size: 2

# Render atiende detrás de un proxy: sin esto getRemoteAddr() es la IP del proxy y el límite de logins por IP
# (ADR 0015) sería uno solo para todos. "native" usa X-Forwarded-For solo si viene de un proxy interno.
server:
  forward-headers-strategy: native

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
