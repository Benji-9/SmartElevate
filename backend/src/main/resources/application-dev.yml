# Perfil de desarrollo: H2 en memoria, sin dependencias externas.
spring:
  datasource:
    url: jdbc:h2:mem:smartelevate;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoint:
    health:
      show-details: always
