name: Deploy Frontend

# Corre SOLO cuando "CI Frontend" terminó OK:
#   - PR hacia main/develop  -> deploy de preview + comentario en el PR con la URL
#   - push a develop         -> deploy de preview
#   - push a main            -> deploy de producción
#
# Nota: GitHub solo dispara `workflow_run` con la versión de este archivo que está en la
# rama por defecto (main). Hasta que llegue a main, este workflow no corre.
on:
  workflow_run:
    workflows: ['CI Frontend']
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  # Nunca cancelar un deploy de producción a mitad de camino.
  cancel-in-progress: ${{ github.event.workflow_run.head_branch != 'main' }}

jobs:
  deploy:
    name: vercel-deploy
    # - CI en verde
    # - Nunca PRs de forks: workflow_run corre con secrets y no queremos ejecutar código ajeno con ellos.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 60.1.3
      IS_PRODUCTION: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Checkout commit validado por CI
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node (LTS)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Resolve deploy target
        id: target
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Vercel no interpola variables en vercel.json: reemplazamos el placeholder ${BACKEND_URL}
      # con la variable de GitHub BACKEND_URL (se puede definir por environment: preview / production).
      - name: Configure API rewrite
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            jq --arg url "${BACKEND_URL%/}" \
              '(.rewrites[] | select(.source == "/api/(.*)") | .destination) = ($url + "/api/$1")' \
              vercel.json > vercel.tmp.json
          else
            echo "::warning title=BACKEND_URL no definida::Se omite el rewrite de /api; el front no va a poder hablar con el backend."
            jq 'del(.rewrites[] | select(.source == "/api/(.*)"))' vercel.json > vercel.tmp.json
          fi
          mv vercel.tmp.json vercel.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="${{ steps.target.outputs.environment }}" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel (${{ steps.target.outputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const run = context.payload.workflow_run;
            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: run.head_sha,
              });
              prNumber = prs.find((pr) => pr.state === 'open')?.number;
            }
            if (!prNumber) {
              core.warning('No se encontró el PR asociado; no se comenta.');
              return;
            }

            const marker = '<!-- smartelevate-vercel-preview -->';
            const body = [
              marker,
              '### 🚀 Preview de Vercel',
              '',
              `**URL:** ${process.env.PREVIEW_URL}`,
              `**Commit:** \`${run.head_sha.slice(0, 7)}\``,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body });
            }
