name: Bug
description: Algo no funciona como debería
title: '[Bug] '
labels: ['type: bug']
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Comportamiento actual vs. esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a /solicitar-turno
        2. Elegir la franja de las 10:00
        3. ...
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Dónde
      options:
        - Local
        - Vercel preview
        - Vercel producción
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas
      render: text
