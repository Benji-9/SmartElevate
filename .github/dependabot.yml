version: 2

# Los PRs de Dependabot van a develop (rama de integración), no a main.
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['type: chore', 'area: backend']
    commit-message:
      prefix: build(backend)
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['type: chore', 'area: frontend']
    commit-message:
      prefix: build(frontend)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: ['type: ci-cd', 'area: infra']
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
